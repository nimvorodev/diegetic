name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Diegetic.app
        run: macos/scripts/build-app.sh
      - name: Verify universal binary
        run: lipo -info macos/outputs/Diegetic.app/Contents/MacOS/Diegetic
